name: S3-Voice WebUI P0 roadmap and non-invasive audit
on:
  pull_request:
    paths:
      - 'docs/ai/WEBUI-*.md'
      - '.github/workflows/ai-webui-p0.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  webui-p0-readonly:
    name: P0 documentation, scope and 100-point roadmap
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate documentation and 13 PR weights offline
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib
          import re
          root = pathlib.Path.cwd()
          roadmap = (root / "docs/ai/WEBUI-ROADMAP.md").read_text(encoding="utf-8")
          baseline = (root / "docs/ai/WEBUI-P0-BASELINE.md").read_text(encoding="utf-8")
          assert "按分钟计费" in roadmap, "missing metered-audio exclusion"
          assert "不增加按分钟" in roadmap, "missing zero-metered-voice budget"
          assert "P5-2" in roadmap and "P0-1" in roadmap
          weights = []
          for line in roadmap.splitlines():
              match = re.match(r'^\| P[0-5] [^|]+\|\s*(?:\d+)?\s*\|\s*P[0-5]-[123][^|]*\|\s*(\d+)\s*\|', line)
              if match:
                  weights.append(int(match.group(1)))
          assert len(weights) == 13, f"expected 13 logical PRs, got {len(weights)}"
          assert sum(weights) == 100, f"invalid 100-point weights: {weights}"
          assert len([line for line in roadmap.splitlines() if re.match(r'^\| P[0-5] [^|]+\|\s*(?:\d+)?\s*\|\s*P[0-5]-[123][^|]*\|', line)]) == 13, "unexpected PR stage rows"
          for title in ("A03", "A04", "A05", "A06", "A07", "A09", "4B", "CI", "VPS"):
              assert title in baseline, f"missing audited scope: {title}"
          for name in (
              "tools/ai/a03-server.sh", "tools/ai/a04-edge.sh",
              "tools/ai/a05-generic.sh", "tools/ai/a06-voice.sh",
              "tools/ai/a09_lite.py", "docs/ai/A09-LITE.md",
          ):
              assert (root / name).is_file(), f"missing inherited source baseline: {name}"
          assert "#27" in baseline and "#28" in baseline and "#29" in baseline and "#30" in baseline
          print("WEBUI_P0_ROADMAP_PASS: 6 phases / 13 PR / 100 points; no paid audio API")
          print("WEBUI_P0_BASELINE_PASS: source files and known unfinished PRs tracked")
          upstream = (root / "docs/ai/WEBUI-P0-UPSTREAM.md").read_text(encoding="utf-8")
          for marker in (
              "v0.9.8", "ota-connector.js", "websocket.js", "recorder.js",
              "player.js", "stream-context.js", "listenMessageHandler.py",
              "Live2D", "libopus.js", "tts.stop", "AudioWorklet",
              "P1-1", "P1-2", "P2-1", "P2-2", "#30",
          ):
              assert marker in upstream, f"upstream acceptance audit missing: {marker}"
          assert "不直接整体移植" in upstream, "missing minimal-reuse gate"
          assert "不复制大型编译文件" in upstream, "missing binary provenance gate"
          print("WEBUI_P0_UPSTREAM_PASS: pinned upstream, browser security, audio, license and text-only gates")
          PY
      - name: Verify P0 changes cannot modify product runtime or old CI
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          # Changes to the approved P1-3 roadmap must retain strict P0
          # documentation validation while P1-3's own independent scope gate
          # owns its runtime/test files. Do not disable existing checks.
          changed="$(git diff --name-only HEAD^1 HEAD)"
          if printf '%s\n' "$changed" | grep -Fxq 'tools/ai/webui_preflight.py'; then
            printf '%s\n' "$changed" | while IFS= read -r path; do
              case "$path" in
                docs/ai/WEBUI-ROADMAP.md|docs/ai/P1-WEBUI-PREFLIGHT.md|.github/workflows/ai-webui-p0.yml|.github/workflows/ai-webui-p1-preflight.yml|tools/ai/webui_preflight.py|tests/ai/test_webui_preflight.py|deploy/ai/webui/docker-compose.production.example.yml) ;;
                *) echo "WEBUI_P0_SCOPE_FAIL: unrelated path $path"; exit 1 ;;
              esac
            done
            echo "WEBUI_P0_P1_3_SCOPE_PASS: P1-3 preflight exception only"
          else
            printf '%s\n' "$changed" | while IFS= read -r path; do
              case "$path" in
                docs/ai/WEBUI-*.md|.github/workflows/ai-webui-p0.yml) ;;
                *) echo "WEBUI_P0_SCOPE_FAIL: unexpected path $path"; exit 1 ;;
              esac
            done
            echo "WEBUI_P0_READONLY_PASS: documentation and dedicated CI only"
          fi
