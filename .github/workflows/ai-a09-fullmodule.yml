name: A09 Manager-Only XiaoZhi activation pilot (static + Docker gates)
on:
  pull_request:
    paths:
      - 'deploy/ai/a09/**'
      - 'tools/ai/a09-fullmodule.sh'
      - 'tests/ai/test_a09_fullmodule.py'
      - 'tests/ai/a09_manager_docker_smoke.sh'
      - 'docs/AI-FULLMODULE-PILOT.md'
      - '.github/workflows/ai-a09-fullmodule.yml'
  workflow_dispatch:
jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Bash parsing
        run: |
          bash -n tools/ai/a09-fullmodule.sh
          bash -n tests/ai/a09_manager_docker_smoke.sh
      - name: Manager-only scope, resource and token contract tests
        run: python3 -m unittest discover -s tests/ai -p 'test_a09_fullmodule.py' -v

  docker-activation:
    needs: [static]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Official Manager/MySQL/Redis isolated startup and OTA activation smoke
        run: bash tests/ai/a09_manager_docker_smoke.sh
