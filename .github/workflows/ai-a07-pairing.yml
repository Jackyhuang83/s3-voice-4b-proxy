name: S3-Voice-AI A07 Waveshare 4B no-flash enrollment

on:
  pull_request:
    paths:
      - 'tools/ai/a07-*'
      - 'tests/ai/a07_*'
      - 'docs/ai/A07-4B-PAIRING.md'
      - '.github/workflows/ai-a07-pairing.yml'
  push:
    branches: [main]
    paths:
      - 'tools/ai/a07-*'
      - 'tests/ai/a07_*'
      - 'docs/ai/A07-4B-PAIRING.md'
      - '.github/workflows/ai-a07-pairing.yml'

permissions:
  contents: read

jobs:
  a07-static:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Python/Bash syntax and safe strict Caddy transformation
        run: |
          python3 -m py_compile tools/ai/a07-pair.py tests/ai/a07_pair_test.py tests/ai/a07_live_gate.py tools/ai/a07-voice-diagnose.py tests/ai/a07_voice_diagnose_test.py tools/ai/a07-audio-pacing.py tests/ai/a07_audio_pacing_test.py tools/ai/a07-voice-once.py tests/ai/a07_voice_once_test.py
          bash -n tools/ai/a07-device.sh
          python3 tests/ai/a07_pair_test.py
          python3 tests/ai/a07_voice_diagnose_test.py
          python3 tests/ai/a07_audio_pacing_test.py
          python3 tests/ai/a07_voice_once_test.py
      - name: Enforce no flashing, firewalls or credentials in commands
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('tools/ai/a07-device.sh').read_text()
          t=Path('tools/ai/a07-pair.py').read_text()
          assert 'docker compose -p s3-voice-ai restart server' in s
          assert 'a04_gateway_smoke.py' in s
          assert 'Type BIND' in s
          assert 'pre-a07.config.yaml' in s and 'pre-a07.identity.json' in s
          assert 'esptool' not in s and 'flash' not in s.lower().replace('firmware flash','')
          assert 'docker system prune' not in s and 'ufw ' not in s
          assert 'request delete' in t and 'resp_headers delete' in t
          assert 'respond "A07 enrollment pending approval" 403' in t
          print('A07_STATIC_PASS: no firmware, no added ports, 403 until bind, private request logging')
          PY

  a07-actual-caddy:
    needs: a07-static
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned official XiaoZhi server on isolated runner
        run: sudo bash tools/ai/a03-server.sh install
      - name: Stage and verify A04 strict Caddy gateway
        run: sudo bash tools/ai/a04-edge.sh stage
      - name: Configure dummy A05/A06 selections (NO paid AI request or model download)
        run: |
          printf 'a07-ci-dummy-not-real-key' | sudo python3 tools/ai/a05-config.py credentials \
            --output /opt/s3-voice-ai/data/.a07-ci-dummy.json \
            --base-url https://example.com/v1 --model ci-dummy-model
          sudo python3 tools/ai/a05-config.py apply \
            --config /opt/s3-voice-ai/data/.config.yaml \
            --credentials /opt/s3-voice-ai/data/.a07-ci-dummy.json
          sudo touch /opt/s3-voice-ai/a05-backup.path
          sudo chmod 600 /opt/s3-voice-ai/a05-backup.path
          # Real A06 previously downloaded Vosk on the target VPS. CI must
          # materialize the SAME official model before an A07 server restart.
          sudo bash tools/ai/a06-voice.sh prepare
          sudo python3 tools/ai/a06-config.py apply \
            --config /opt/s3-voice-ai/data/.config.yaml
          sudo touch /opt/s3-voice-ai/a06-backup.path
          sudo chmod 600 /opt/s3-voice-ai/a06-backup.path
      - name: Stage private enrollment URL; existing A04 gate remains valid
        run: |
          sudo bash tools/ai/a07-device.sh stage
          sudo bash tools/ai/a07-device.sh status
      - name: One synthetic real-formatted hardware request is denied until bound
        run: |
          sudo python3 tests/ai/a07_live_gate.py \
            --state /opt/s3-voice-ai-a07/enroll.json --mode stage
          sudo bash tools/ai/a07-device.sh capture
          sudo python3 - <<'PY'
          import json,subprocess
          logs=subprocess.check_output(['docker','exec','s3-voice-ai-gateway','cat','/config/a07-pair.log'],text=True)
          for line in logs.splitlines():
              record=json.loads(line)
              assert 'request' not in record and 'resp_headers' not in record
              assert '/xiaozhi/ota/' not in line and 'Authorization' not in line
          print('A07_CAPTURE_PRIVACY_PASS: Caddy log removes request URI/headers including 256-bit bearer')
          PY
      - name: Owner-confirmed binding switches strict gateway to captured device only
        run: |
          printf 'BIND\n' | sudo bash tools/ai/a07-device.sh bind
          sudo python3 tests/ai/a07_live_gate.py \
            --state /opt/s3-voice-ai-a07/enroll.json --mode bound
          sudo bash tools/ai/a07-device.sh status
          sudo python3 tests/ai/a04_gateway_smoke.py \
            --identity /opt/s3-voice-ai-edge/identity.json \
            --origin http://127.0.0.1:18080
      - name: Trial the native 60ms Opus pacing with real server restart, then rollback without touching A04
        run: |
          sudo python3 tools/ai/a07-audio-pacing.py status
          sudo python3 tools/ai/a07-audio-pacing.py apply
          sudo python3 tools/ai/a07-audio-pacing.py status
          sudo docker exec -w /opt/xiaozhi-esp32-server s3-voice-ai-server python3 -c "
          import yaml
          c=yaml.safe_load(open('data/.config.yaml'))
          assert c['tts_audio_send_delay']==60
          assert c['selected_module']['LLM']=='GenericGPTLLM'
          assert c['selected_module']['ASR']=='VoskASR'
          assert c['selected_module']['TTS']=='EdgeTTS'
          print('A07_PACING_LIVE_PASS: official 60ms used in live original A03 server')"
          sudo python3 tools/ai/a07-audio-pacing.py rollback
          sudo docker exec -w /opt/xiaozhi-esp32-server s3-voice-ai-server python3 -c "
          import yaml
          c=yaml.safe_load(open('data/.config.yaml'))
          assert c.get('tts_audio_send_delay',0)==0
          assert c['selected_module']['LLM']=='GenericGPTLLM'
          assert c['selected_module']['ASR']=='VoskASR'
          assert c['selected_module']['TTS']=='EdgeTTS'
          print('A07_PACING_LIVE_ROLLBACK_PASS: original 0ms and all voice components preserved')"
      - name: Hardware binding rollback restores original A04 identities and A05/A06 selections
        run: |
          sudo bash tools/ai/a07-device.sh rollback
          sudo python3 tests/ai/a04_gateway_smoke.py \
            --identity /opt/s3-voice-ai-edge/identity.json \
            --origin http://127.0.0.1:18080
          sudo docker exec -w /opt/xiaozhi-esp32-server s3-voice-ai-server python3 -c "
          import yaml
          c=yaml.safe_load(open('data/.config.yaml'))
          assert c['selected_module']['LLM']=='GenericGPTLLM'
          assert c['selected_module']['ASR']=='VoskASR'
          assert c['selected_module']['TTS']=='EdgeTTS'
          print('A07_ROLLBACK_PASS: generic GPT, native Vosk and EdgeTTS preserved')"
      - name: Reproduce interrupted A07 staging and verify one-command recovery
        run: |
          sudo bash tools/ai/a07-device.sh stage
          sudo bash tools/ai/a07-device.sh recover
          sudo bash tools/ai/a07-device.sh preflight
          sudo python3 tests/ai/a04_gateway_smoke.py \
            --identity /opt/s3-voice-ai-edge/identity.json \
            --origin http://127.0.0.1:18080
          test ! -e /opt/s3-voice-ai-a07
          sudo sh -c "test -d /opt/s3-voice-ai/a07-aborted-*"
          echo 'A07_RECOVER_PASS: aborted pairing archived, original OTA/WSS restored, new preflight unblocked'
      - name: Stop only ephemeral A03/A04 containers
        if: always()
        run: |
          if test -f /opt/s3-voice-ai-edge/pre-a04.config.yaml; then
            sudo bash tools/ai/a04-edge.sh rollback || true
          fi
          if test -f /opt/s3-voice-ai/.env; then
            sudo bash tools/ai/a03-server.sh rollback || true
          fi
