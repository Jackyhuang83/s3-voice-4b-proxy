# A09-Lite P2. Separate iPhone gateway and stdlib OTA adapter; reuse A03 voice.
name: s3-voice-a09-lite
services:
  adapter:
    container_name: s3-voice-a09-lite-adapter
    image: ${PYTHON_IMAGE:?immutable official Python digest required}
    user: '10001:10001'
    restart: 'no'
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    cpus: '0.30'
    mem_limit: 128m
    pids_limit: 64
    environment:
      PYTHONDONTWRITEBYTECODE: '1'
      A09_LITE_DOCKER_INTERNAL: '1'
      A09_LITE_PORT: '19009'
      A09_LITE_UPSTREAM: 'http://s3-voice-ai-server:8003/xiaozhi/ota/'
      A09_LITE_WSS_URL: 'wss://${IOS_HOSTNAME:?}/xiaozhi/v1/${IOS_SECRET:?}'
    command: ["python", "-I", "/app/a09_lite.py", "--db", "/var/lib/s3-voice-a09-lite/activation.sqlite3", "serve"]
    volumes:
      - './a09_lite.py:/app/a09_lite.py:ro'
      - './data:/var/lib/s3-voice-a09-lite:rw'
    tmpfs:
      - '/tmp:rw,nosuid,nodev,size=8m,mode=1777'
    healthcheck:
      test: ["CMD", "python", "-I", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:19009/health',timeout=2).close()"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks: [a09, a03]

  gateway:
    container_name: s3-voice-a09-lite-gateway
    image: ${CADDY_IMAGE:?existing A04 gateway image ID required}
    user: '1000:1000'
    restart: 'no'
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    cpus: '0.20'
    mem_limit: 96m
    pids_limit: 80
    depends_on:
      adapter: {condition: service_healthy}
    volumes:
      - './Caddyfile:/etc/caddy/Caddyfile:ro'
    environment:
      XDG_CONFIG_HOME: /config
      XDG_DATA_HOME: /data
    tmpfs:
      - '/tmp:rw,nosuid,nodev,size=8m,mode=1777'
      - '/config:rw,nosuid,nodev,size=16m,mode=1777'
      - '/data:rw,nosuid,nodev,size=16m,mode=1777'
    networks: [a09, a03, a04front]

networks:
  a09:
    internal: true
  a03:
    external: true
    name: s3-voice-ai_default
  a04front:
    external: true
    name: s3-voice-ai-edge_front