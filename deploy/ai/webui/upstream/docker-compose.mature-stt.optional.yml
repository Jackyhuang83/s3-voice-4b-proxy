# OPTIONAL official-product speech pilot (all upstream components).
# Activate ONLY with a separate resource preflight >=2.5GiB MemAvailable.
# This is NOT included in default Open WebUI docker compose up.
# Third-party mature ASR: https://github.com/hwdsl2/scribecrate
# Upstream STT API: POST /v1/audio/transcriptions
# Open WebUI STT reference: https://docs.openwebui.com/features/chat-conversations/audio/speech-to-text/self-hosted-stt/
services:
  upstream-webui:
    depends_on:
      speech-stt:
        condition: service_started
    environment:
      AUDIO_STT_ENGINE: openai
      AUDIO_STT_OPENAI_API_BASE_URL: http://speech-stt:9000/v1
      AUDIO_STT_OPENAI_API_KEY: ${UPSTREAM_STT_KEY:?provide_private_test_token}
      AUDIO_STT_MODEL: whisper-1
      AUDIO_TTS_ENGINE: "" # browser TTS (Safari compatible voices tested separately)
      AUDIO_REALTIME_ENABLED: "false" # no paid realtime model
  speech-stt:
    image: hwdsl2/whisper-server:latest
    # Only for isolated CI/prototype. Resolve to immutable sha256 digest
    # before ANY user VPS use; latest MUST NOT be used for production.
    restart: "no"
    environment:
      WHISPER_MODEL: base
      WHISPER_LANGUAGE: zh
      WHISPER_THREADS: "2"
      WHISPER_BEAM: "1"
      WHISPER_COMPUTE_TYPE: int8
      WHISPER_API_KEY: ${UPSTREAM_STT_KEY:?provide_private_test_token}
    volumes:
      - whisper_eval_cache:/var/lib/whisper
    mem_limit: 1024m
    cpus: 1.0
    pids_limit: 128
    security_opt:
      - no-new-privileges:true

volumes:
  whisper_eval_cache:
